<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:#0b0d12;
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }

  /* Khung ngoài dùng "padding-top %" để luôn có chiều cao cố định,
     chạy ổn định trên mọi trình duyệt/app webview (Zalo, Messenger...). */
  #wrap{
    position:relative;
    width:100%;
    max-width:420px;
    margin:0 auto;
  }
  #wrap::before{
    content:"";
    display:block;
    padding-top:177.78%; /* tỉ lệ 9:16 */
  }

  #stage{
    position:absolute;
    inset:0;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    background:#70c5ce;
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
    touch-action:none;
    cursor:pointer;
  }

  #hud{
    position:absolute; top:16px; left:0; right:0;
    display:flex; justify-content:center;
    pointer-events:none;
    z-index:5;
  }
  #score{
    font-size:46px; font-weight:800;
    color:#fff;
    -webkit-text-stroke:2px #543847;
    text-shadow:0 3px 0 #543847;
    letter-spacing:1px;
  }

  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px;
    background:rgba(0,0,0,.35);
    z-index:10;
    text-align:center;
    padding:24px;
  }
  #overlay.hidden{ display:none; }
  #overlay h1{
    font-size:28px; font-weight:800;
    color:#fff;
    -webkit-text-stroke:1.5px #543847;
    text-shadow:0 3px 0 #543847;
  }
  #overlay p{
    font-size:13px; color:#fff;
    max-width:260px; line-height:1.6;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  #overlay .stats{
    display:flex; gap:26px; margin:4px 0;
    background:rgba(255,255,255,.9);
    padding:10px 20px;
    border-radius:12px;
  }
  #overlay .stat b{
    display:block; font-size:22px; font-weight:800; color:#543847;
  }
  #overlay .stat span{
    display:block; font-size:10px; color:#8a7a80; letter-spacing:.5px; text-transform:uppercase; margin-top:2px;
  }
  #startBtn{
    margin-top:6px;
    padding:12px 32px;
    border:none; border-radius:999px;
    background:#fbbf24;
    color:#543847; font-weight:800; font-size:14px;
    cursor:pointer;
    box-shadow:0 6px 0 #b8860b, 0 8px 16px rgba(0,0,0,.3);
  }
  #startBtn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b8860b; }

  #hint{
    position:absolute; bottom:14px; left:0; right:0;
    text-align:center;
    font-size:11px; color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
    z-index:5;
    pointer-events:none;
  }

  #errBox{
    position:absolute; left:8px; right:8px; bottom:8px;
    background:rgba(248,113,113,.15);
    border:1px solid rgba(248,113,113,.4);
    color:#7a1f1f;
    font-size:11px;
    padding:8px 10px;
    border-radius:8px;
    z-index:20;
    display:none;
    white-space:pre-wrap;
    background:#fff;
  }
</style>
</head>
<body>

<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud"><div id="score">0</div></div>
    <div id="hint">Bấm / Space để bay</div>

    <div id="overlay">
      <h1 id="overlayTitle">Flappy Bird</h1>
      <p id="overlayDesc">Bấm hoặc nhấn Space để giữ cho chim bay qua các cột.</p>
      <div class="stats" id="statsRow" style="display:none;">
        <div class="stat"><b id="finalScore">0</b><span>Điểm</span></div>
        <div class="stat"><b id="bestScore">0</b><span>Kỷ lục</span></div>
      </div>
      <button id="startBtn">Bắt đầu</button>
    </div>

    <div id="errBox"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayDesc = document.getElementById('overlayDesc');
  const statsRow = document.getElementById('statsRow');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const startBtn = document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const hint = document.getElementById('hint');
  const errBox = document.getElementById('errBox');

  const BEST_KEY = 'flappy-best-score';
  const FALLBACK_W = 360, FALLBACK_H = 640;

  let W = FALLBACK_W, H = FALLBACK_H, DPR = 1;

  let bird, pipes, score, best, running, lastTime, lastPipeAt, groundOffset;
  let clouds = [];
  let rafId = null;

  /* ------------ Thông số độ khó (gần với bản gốc, không quá gắt) ------------ */
  const GRAVITY = 1400;
  const FLAP_VELOCITY = -400;
  const PIPE_GAP = 190;
  const PIPE_WIDTH = 60;
  const PIPE_INTERVAL = 1650;
  const BASE_SPEED = 130;
  const MAX_RAMP = 55;
  let PIPE_SPEED = BASE_SPEED;

  function showError(msg){
    errBox.textContent = 'Lỗi: ' + msg;
    errBox.style.display = 'block';
  }

  function initScenery(){
    clouds = Array.from({length: 4}, () => ({
      x: Math.random()*W,
      y: H*0.1 + Math.random()*H*0.25,
      scale: 0.7 + Math.random()*0.6
    }));
  }

  function measure(){
    const rect = stage.getBoundingClientRect();
    return {
      w: rect.width  > 4 ? rect.width  : FALLBACK_W,
      h: rect.height > 4 ? rect.height : FALLBACK_H
    };
  }

  function resize(){
    const { w, h } = measure();
    DPR = window.devicePixelRatio || 1;
    canvas.width  = Math.round(w * DPR);
    canvas.height = Math.round(h * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    W = w; H = h;
    initScenery();
    if (bird){
      bird.y = Math.min(Math.max(bird.y, bird.r), H - bird.r - 40);
    }
  }

  if (window.ResizeObserver){
    const ro = new ResizeObserver(() => resize());
    ro.observe(stage);
  } else {
    window.addEventListener('resize', resize);
  }

  function resetState(){
    bird = { x: 0, y: 0, vy: 0, r: 14, rot: 0, wing: 0 };
    pipes = [];
    score = 0;
    running = false;
    lastPipeAt = 0;
    groundOffset = 0;
    PIPE_SPEED = BASE_SPEED;
    bird.x = W * 0.3;
    bird.y = H * 0.42;
    scoreEl.textContent = '0';
  }

  best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;

  function spawnPipe(){
    const margin = 60;
    const groundH = 60;
    const span = H - groundH - margin*2 - PIPE_GAP*0; // giữ khoảng lề trên/dưới
    const gapCenter = margin + Math.random() * Math.max(40, H - groundH - margin*2);
    pipes.push({ x: W + 20, gapCenter, passed:false });
  }

  function flap(){
    if (!running) return;
    bird.vy = FLAP_VELOCITY;
    bird.wing = 1;
  }

  function startGame(){
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    errBox.style.display = 'none';
    resize();
    resetState();
    overlay.classList.add('hidden');
    hint.style.display = 'block';
    running = true;
    lastTime = performance.now();
    lastPipeAt = -PIPE_INTERVAL;
    rafId = requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    if (score > best){
      best = score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch(e){}
    }
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = best;
    statsRow.style.display = 'flex';
    overlayTitle.textContent = 'Va vào rồi!';
    overlayDesc.textContent = 'Thử lại xem có phá được kỷ lục không nhé.';
    startBtn.textContent = 'Chơi lại';
    overlay.classList.remove('hidden');
    hint.style.display = 'none';
  }

  function update(dt){
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 550));
    if (bird.wing > 0) bird.wing = Math.max(0, bird.wing - dt*3);

    groundOffset -= PIPE_SPEED * dt;
    for (const p of pipes){ p.x -= PIPE_SPEED * dt; }
    while (pipes.length && pipes[0].x < -PIPE_WIDTH - 20) pipes.shift();

    for (const p of pipes){
      if (!p.passed && p.x + PIPE_WIDTH < bird.x - bird.r){
        p.passed = true;
        score++;
        scoreEl.textContent = score;
        PIPE_SPEED = BASE_SPEED + Math.min(score, 25) * (MAX_RAMP/25);
      }
    }

    const groundH = 60;
    if (bird.y + bird.r > H - groundH || bird.y - bird.r < 0){
      bird.y = Math.min(bird.y, H - groundH - bird.r);
      endGame();
      return;
    }
    for (const p of pipes){
      const withinX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + PIPE_WIDTH;
      if (withinX){
        const gapTop = p.gapCenter - PIPE_GAP/2;
        const gapBottom = p.gapCenter + PIPE_GAP/2;
        if (bird.y - bird.r < gapTop || bird.y + bird.r > gapBottom){
          endGame();
          return;
        }
      }
    }
  }

  /* ------------ Vẽ (giao diện cổ điển: trời xanh, ống xanh lá, đất vàng) ------------ */
  function drawSky(){
    const sky = ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0, '#70c5ce');
    sky.addColorStop(1, '#a9e4e8');
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,W,H);
  }

  function drawCloud(cx, cy, scale){
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const puffs = [[0,0,16],[14,-5,12],[-14,-3,11],[26,2,9],[-26,3,9]];
    for (const [dx,dy,r] of puffs){
      ctx.beginPath();
      ctx.ellipse(cx+dx*scale, cy+dy*scale, r*scale, r*0.7*scale, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }

  function drawClouds(dt){
    for (const c of clouds){
      c.x -= 8 * dt;
      if (c.x < -50) c.x = W + 50;
      drawCloud(c.x, c.y, c.scale);
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawPipe(p){
    const gapTop = p.gapCenter - PIPE_GAP/2;
    const gapBottom = p.gapCenter + PIPE_GAP/2;
    const bodyColor = '#74bf2e';
    const edgeColor = '#4f8f22';
    const capH = 22, capOverhang = 5;

    // thân ống trên
    ctx.fillStyle = bodyColor;
    ctx.fillRect(p.x, 0, PIPE_WIDTH, gapTop - capH);
    ctx.fillStyle = edgeColor;
    ctx.fillRect(p.x, 0, 5, gapTop - capH);
    ctx.fillRect(p.x + PIPE_WIDTH - 5, 0, 5, gapTop - capH);
    // mũ ống trên
    ctx.fillStyle = bodyColor;
    roundRect(p.x - capOverhang, gapTop - capH, PIPE_WIDTH + capOverhang*2, capH, 4);
    ctx.fill();
    ctx.fillStyle = edgeColor;
    ctx.fillRect(p.x - capOverhang, gapTop - capH, 5, capH);
    ctx.fillRect(p.x + PIPE_WIDTH + capOverhang - 5, gapTop - capH, 5, capH);
    ctx.fillRect(p.x - capOverhang, gapTop - 5, PIPE_WIDTH + capOverhang*2, 5);

    // thân ống dưới
    ctx.fillStyle = bodyColor;
    ctx.fillRect(p.x, gapBottom + capH, PIPE_WIDTH, H - (gapBottom+capH));
    ctx.fillStyle = edgeColor;
    ctx.fillRect(p.x, gapBottom + capH, 5, H - (gapBottom+capH));
    ctx.fillRect(p.x + PIPE_WIDTH - 5, gapBottom + capH, 5, H - (gapBottom+capH));
    // mũ ống dưới
    ctx.fillStyle = bodyColor;
    roundRect(p.x - capOverhang, gapBottom, PIPE_WIDTH + capOverhang*2, capH, 4);
    ctx.fill();
    ctx.fillStyle = edgeColor;
    ctx.fillRect(p.x - capOverhang, gapBottom, 5, capH);
    ctx.fillRect(p.x + PIPE_WIDTH + capOverhang - 5, gapBottom, 5, capH);
    ctx.fillRect(p.x - capOverhang, gapBottom + capH - 5, PIPE_WIDTH + capOverhang*2, 5);
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // thân
    ctx.fillStyle = '#f7d038';
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.r, bird.r*0.82, 0, 0, Math.PI*2);
    ctx.fill();

    // bụng trắng
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath();
    ctx.ellipse(-1, bird.r*0.25, bird.r*0.7, bird.r*0.5, 0, 0, Math.PI*2);
    ctx.fill();

    // cánh (vỗ nhẹ khi bay)
    const wingLift = bird.wing * 6;
    ctx.fillStyle = '#f2b53c';
    ctx.beginPath();
    ctx.ellipse(-2, 2 - wingLift, bird.r*0.55, bird.r*0.34, -0.25, 0, Math.PI*2);
    ctx.fill();

    // mắt
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(bird.r*0.38, -bird.r*0.32, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#2b2b2b';
    ctx.beginPath();
    ctx.arc(bird.r*0.5, -bird.r*0.3, 2.4, 0, Math.PI*2);
    ctx.fill();

    // mỏ
    ctx.fillStyle = '#f2994a';
    ctx.beginPath();
    ctx.moveTo(bird.r*0.68, -1);
    ctx.lineTo(bird.r*1.35, 3);
    ctx.lineTo(bird.r*0.68, 7);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawGround(){
    const groundH = 60;
    const groundY = H - groundH;
    ctx.fillStyle = '#ded895';
    ctx.fillRect(0, groundY, W, groundH);
    ctx.fillStyle = '#c9c17a';
    const step = 22;
    const offset = ((groundOffset % step) + step) % step;
    for (let x = -offset; x < W; x += step){
      ctx.fillRect(x, groundY, step*0.5, 6);
    }
    ctx.fillStyle = '#58ab27';
    ctx.fillRect(0, groundY, W, 8);
  }

  function render(dt){
    ctx.clearRect(0,0,W,H);
    drawSky();
    drawClouds(dt || 0);
    for (const p of pipes) drawPipe(p);
    drawBird();
    drawGround();
  }

  function loop(now){
    try {
      if (!running) return;
      let dt = (now - lastTime) / 1000;
      dt = Math.min(dt, 0.033);
      lastTime = now;

      if (now - lastPipeAt > PIPE_INTERVAL){
        spawnPipe();
        lastPipeAt = now;
      }

      update(dt);
      if (!running) { render(dt); return; }
      render(dt);
      rafId = requestAnimationFrame(loop);
    } catch (err){
      running = false;
      showError(err && err.message ? err.message : String(err));
    }
  }

  function handleInput(e){
    if (e.type === 'keydown' && e.code !== 'Space') return;
    e.preventDefault();
    if (!running) return;
    flap();
  }
  window.addEventListener('keydown', handleInput);
  canvas.addEventListener('pointerdown', (e)=>{ e.preventDefault(); if(running) flap(); });

  startBtn.addEventListener('click', startGame);

  function boot(){
    try {
      resize();
      resetState();
      bestScoreEl.textContent = best;
      render(0);
    } catch (err){
      showError(err && err.message ? err.message : String(err));
    }
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive'){
    boot();
  } else {
    document.addEventListener('DOMContentLoaded', boot);
  }
  window.addEventListener('load', resize);
})();
</script>
</body>
</html>
